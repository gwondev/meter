spring:
  autoconfigure:
    exclude:
      - io.awspring.cloud.autoconfigure.s3.S3AutoConfiguration
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 14MB
  datasource:
    url: jdbc:mysql://gwon-db:3306/meter?serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    from: ${MAIL_FROM:${MAIL_USERNAME:no-reply@meter.local}}

google:
  client:
    id: ${GOOGLE_CLIENT_ID}

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    models: ${GEMINI_MODELS:gemini-2.5-flash,gemini-2.5-flash-lite}
    timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:18}
    max-image-side: ${GEMINI_MAX_IMAGE_SIDE:960}
    jpeg-quality: ${GEMINI_JPEG_QUALITY:0.8}

mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://mosquitto:1883}
  client-id: ${MQTT_CLIENT_ID:meter-backend}
  subscriber-client-id: ${MQTT_SUBSCRIBER_CLIENT_ID:meter-backend-sub}

meter:
  dev-user:
    enabled: ${METER_DEV_USER_ENABLED:false}
    oauth-id: ${METER_DEV_USER_OAUTH_ID:dev-local-meter}
  iot:
    mqtt-host: mqtt-meter.gwon.run
    mqtt-port: 80
