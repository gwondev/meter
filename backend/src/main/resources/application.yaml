spring:
  autoconfigure:
    exclude:
      - io.awspring.cloud.autoconfigure.s3.S3AutoConfiguration
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 14MB
  datasource:
    url: jdbc:mysql://gwon-db:3306/meter?serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false&characterEncoding=UTF-8
    username: ${DB_USERNAME:gwon}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 30000
      initialization-fail-timeout: 120000
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    from: ${MAIL_FROM:${MAIL_USERNAME:no-reply@meter.local}}

google:
  client:
    id: ${GOOGLE_CLIENT_ID}

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    models: ${GEMINI_MODELS:gemini-2.5-flash,gemini-2.5-flash-lite}
    timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:18}
    max-image-side: ${GEMINI_MAX_IMAGE_SIDE:960}
    jpeg-quality: ${GEMINI_JPEG_QUALITY:0.8}

mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://mosquitto:1883}
  client-id: ${MQTT_CLIENT_ID:meter-backend}
  subscriber-client-id: ${MQTT_SUBSCRIBER_CLIENT_ID:meter-backend-sub}

meter:
  dev-user:
    enabled: ${METER_DEV_USER_ENABLED:false}
    oauth-id: ${METER_DEV_USER_OAUTH_ID:dev-local-meter}
  iot:
    mqtt-host: mqtt-meter.gwon.run
    mqtt-port: 80
  device:
    # /api/device/** 접근용 사전 공유 토큰. 미설정 시 해당 경로는 503으로 차단된다.
    token: ${METER_DEVICE_TOKEN:}
  module:
    # depthCm 미지정 모듈의 기본 용기 깊이(cm) — heightCm → fillPercent 환산 기준
    default-depth-cm: ${METER_MODULE_DEFAULT_DEPTH_CM:60}
    # 신호가 이 기간 이상 끊긴 모듈은 자동 삭제된다
    stale-retention-days: ${METER_MODULE_STALE_RETENTION_DAYS:10}
  upload:
    # 모듈2 스냅샷 저장 디렉터리 (컨테이너 볼륨)
    dir: ${METER_UPLOAD_DIR:/backend/uploads}
    keep-per-module: ${METER_UPLOAD_KEEP_PER_MODULE:50}

server:
  port: 8080
  address: 0.0.0.0

logging:
  level:
    com.zaxxer.hikari.pool.HikariPool: WARN
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: WARN
