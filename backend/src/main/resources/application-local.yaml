# IDE에서 로컬만 돌릴 때: MySQL 없이 H2 인메모리 + dev 유저 시드
spring:
  datasource:
    url: jdbc:h2:mem:meter;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update

meter:
  dev-user:
    enabled: true
  device:
    token: ${METER_DEVICE_TOKEN:local-dev-device-token}
  upload:
    # 로컬은 컨테이너 볼륨이 없으므로 프로젝트 하위에 저장한다
    dir: ${METER_UPLOAD_DIR:./build/uploads}
