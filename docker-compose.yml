services:
  backend:
    restart: always
    container_name: meter-backend
    build: ./backend
    env_file:
      - ./backend/.env.production
    depends_on:
      - mosquitto
    networks:
      - global_network

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: meter-mosquitto
    restart: always
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - global_network

  frontend:
    restart: always
    container_name: meter-frontend
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_KAKAO_API: ${VITE_KAKAO_API}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    networks:
      - global_network

networks:
  global_network:
    external: true

volumes:
  mosquitto_data:
  mosquitto_log:
