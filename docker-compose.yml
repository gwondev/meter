services:
  backend:
    restart: always
    container_name: meter-backend
    build: ./backend
    env_file:
      - ./backend/.env.production
    environment:
      METER_VISION_URL: http://meter-vision:8090
      METER_VISION_ENABLED: "true"
      METER_UPLOAD_KEEP_PER_MODULE: "10"
    depends_on:
      - mosquitto
      - vision
    volumes:
      - backend_uploads:/backend/uploads
    networks:
      - meter_internal
      - global_network

  vision:
    restart: always
    container_name: meter-vision
    build: ./vision_service
    volumes:
      # 백엔드와 동일 경로로 마운트 — Java가 넘긴 absolute path 그대로 읽음
      - backend_uploads:/backend/uploads
    networks:
      - meter_internal

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: meter-mosquitto
    restart: always
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      meter_internal:
        aliases:
          - meter-mosquitto
          - meter-mqtt
      global_network: {}

  frontend:
    restart: always
    container_name: meter-frontend
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_KAKAO_API: ${VITE_KAKAO_API}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    networks:
      - global_network

networks:
  meter_internal:
    driver: bridge
  global_network:
    external: true

volumes:
  mosquitto_data:
  mosquitto_log:
  backend_uploads:
