; METER 모듈1 (적재 높이 측정 노드)
; 모듈 고유 이름은 src/module1.cpp 상단 MODULE_SERIAL 상수에서 직접 수정한다. (m1, m2, m3 …)
; MQTT: Cloudflare Tunnel → meter-mosquitto:9001 → ws://mqtt-meter.gwon.run:80
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.sdkconfig.defaults = sdkconfig.defaults
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^6.21.5
