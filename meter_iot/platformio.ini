; METER IoT — build_flags 의 METER_MODULE_SERIAL 만 변경 (m1, m2, m20 등)
; MQTT: Cloudflare Tunnel → meter-mosquitto:9001 → ws://mqtt-meter.gwon.run:80
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.sdkconfig.defaults = sdkconfig.defaults
monitor_speed = 115200
upload_speed = 115200
build_flags = -DMETER_MODULE_SERIAL=m1
lib_deps =
    bblanchon/ArduinoJson@^6.21.5
