; METER D모듈 (초음파 → 보드에서 fillPercent 산출)
; 시리얼은 src/module1.cpp 상단 MODULE_SERIAL (m1, m2, …)
; MQTT: ws://mqtt-meter.gwon.run:80 → meter/{serial}/status
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.sdkconfig.defaults = sdkconfig.defaults
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^6.21.5
