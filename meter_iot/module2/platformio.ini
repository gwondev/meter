; METER R모듈 (이미지 MQTT 전용) — ESP32-CAM
; 시리얼: src/module2.cpp 상단 MODULE_SERIAL = "r1"
; MQTT: ws://mqtt-meter.gwon.run:80 → meter/{serial}/status
[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix='-xclk 20000000'
lib_deps =
    bblanchon/ArduinoJson@^6.21.5
