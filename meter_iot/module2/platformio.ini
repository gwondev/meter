; METER R모듈 r1 테스트 — ESP32-CAM
; 이미지: data/images/*.jpg 넣고
;   pio run -t uploadfs
;   pio run -t upload
; MQTT: ws://mqtt-meter.gwon.run:80 → meter/r1/status
[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.f_flash = 40000000L
board_build.flash_mode = dio
board_build.filesystem = littlefs
build_flags =
    -DBOARD_HAS_PSRAM
lib_deps =
    bblanchon/ArduinoJson@^6.21.5
